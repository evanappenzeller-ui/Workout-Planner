<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="color-scheme" content="dark">
<title>Workout Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0C0E; --surface:#15181C; --surface-2:#1D2126; --surface-3:#272C33; --line:#2A2F36;
  --text:#F2F4F6; --muted:#8E97A3; --blue:#2D8CEB; --blue-2:#1F76CC; --green:#5CD65C; --red:#E8614A; --danger:#FF6B5E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(120px + var(--safe-b))}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:0;z-index:8;background:rgba(11,12,14,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:calc(6px + var(--safe-t)) 10px 6px;border-bottom:1px solid var(--line)}
.top .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.icon-btn{width:48px;height:48px;border:0;background:none;border-radius:14px;display:grid;place-items:center;color:var(--text)}
.icon-btn svg{width:26px;height:26px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;color:var(--blue);stroke-width:2.4}
.brand b{color:var(--blue);font-weight:800}
.top h1{margin:0;text-align:center;font-size:19px;font-weight:700}

main{max-width:640px;margin:0 auto;padding:0 18px}

/* day screen */
.hero{padding:22px 0 6px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted);font-size:14px;font-weight:600}
.eyebrow .next{color:var(--green)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}
.dots i.on{background:var(--blue)}
.hero h2{margin:6px 0 2px;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.hero p.sub{margin:0;color:var(--muted)}
.count{margin:26px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.xlist{list-style:none;margin:0;padding:0}
.xrow{width:100%;display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:12px 0;border:0;background:none;text-align:left}
.thumb{width:76px;height:76px;border-radius:18px;background:var(--surface);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb svg{width:34px;height:34px;color:var(--blue)}
.xname{display:block;font-size:19px;font-weight:700;line-height:1.2}
.xmeta{display:block;margin-top:3px;color:var(--muted);font-size:16px}
.xstat{color:var(--blue);font-size:22px;letter-spacing:2px;font-weight:800}
.pill{display:inline-block;min-width:44px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;text-align:center;letter-spacing:0}
.okmark{width:32px;height:32px;border-radius:50%;background:var(--green);color:#08210A;display:grid;place-items:center}
.okmark svg{width:20px;height:20px;stroke-width:3}
.xrow.complete .xname{color:var(--muted)}
.warm{padding:2px 0 10px 92px}
.warm label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;min-height:44px}
.warm input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.warm b{font-weight:600} .warm span{display:block;color:var(--muted);font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;margin:22px 0 0;border:0;border-radius:18px;
  background:var(--blue);color:#fff;font-size:21px;font-weight:700}
.cta:active{background:var(--blue-2)}
.cta[disabled]{opacity:.4}
.cta svg{width:28px;height:28px;fill:#fff;stroke:none}
.textlink{display:block;width:100%;margin:12px 0 0;padding:10px;border:0;background:none;color:var(--blue);font-weight:600;font-size:16px}
.note{margin:10px 0 0;color:var(--muted);font-size:14px;text-align:center}

/* day tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:9;width:min(calc(100% - 24px),440px);
  display:flex;gap:4px;padding:6px;border-radius:32px;background:rgba(29,33,38,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tabs button{flex:1;position:relative;min-height:58px;border:0;border-radius:26px;background:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600}
.tabs button svg{width:26px;height:26px}
.tabs button.on{background:var(--bg);color:var(--blue)}
.tabs button.next::after{content:"";position:absolute;top:9px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--green)}

/* exercise screen */
#ex{position:fixed;inset:0;z-index:20;background:#000;overflow-y:auto;overscroll-behavior:contain}
#ex[hidden]{display:none}
.ex-close{position:fixed;top:calc(10px + var(--safe-t));right:12px;z-index:22;width:48px;height:48px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.ex-close svg{width:30px;height:30px;stroke-width:2.6}
.ex-fig{margin:0 auto;max-width:640px;padding:calc(58px + var(--safe-t)) 12px 6px}
.ex-fig img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 16px;max-width:640px;margin:0 auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{position:relative;flex:none;width:80px;height:80px;border-radius:20px;border:3px solid transparent;background:var(--surface-2);padding:4px}
.strip button img{width:100%;height:100%;object-fit:contain}
.strip button.cur{border-color:var(--blue)}
.strip button .ok{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#08210A;display:grid;place-items:center}
.strip button .ok svg{width:14px;height:14px;stroke-width:3.4}
.sheet{max-width:640px;margin:0 auto;min-height:60vh;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(40px + var(--safe-b))}
.grab{width:46px;height:5px;border-radius:3px;background:var(--surface-3);margin:2px auto 16px}
.status{display:flex;align-items:center;gap:6px;margin:0;font-size:17px;font-weight:700}
.status svg{width:22px;height:22px;stroke-width:2.6}
.status.up{color:var(--green)} .status.new{color:var(--blue)} .status.same{color:var(--muted)}
.sheet h2{margin:6px 0 2px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.target{margin:0;color:var(--muted);font-size:19px}
.setrow{display:flex;align-items:center;gap:12px;margin:22px 0 0}
.circles{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.circle{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface-3);color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center;line-height:1}
.circle.next{box-shadow:inset 0 0 0 2.5px var(--blue)}
.circle.done{background:var(--blue)}
.circle small{display:block;font-size:10px;font-weight:600;opacity:.85;margin-top:2px}
.edit{border:0;border-radius:12px;background:var(--surface-2);color:var(--blue);font-weight:700;font-size:17px;padding:10px 16px}
.log{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:66px;margin:22px 0 0;border:0;border-radius:18px;
  background:var(--blue);color:#fff;font-size:24px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.log:active{background:var(--blue-2)}
.log svg{width:30px;height:30px;stroke-width:3.4}
.log.soft{text-transform:none;font-size:20px;letter-spacing:0}
.lognote{margin:10px 0 0;color:var(--muted);font-size:15px;text-align:center}
.edit-panel{margin-top:18px;padding:14px;border-radius:18px;background:var(--surface-2)}
.sets-head,.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:10px;align-items:center}
.edit-panel.bw .sets-head,.edit-panel.bw .set{grid-template-columns:30px 1fr 48px}
.sets-head{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.set{margin:8px 0}
.set-n{font-weight:800;text-align:center;color:var(--muted)}
.set input{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.check{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--surface-3);background:transparent;display:grid;place-items:center;color:transparent}
.check svg{width:24px;height:24px;stroke-width:3}
.set.done .check{background:var(--blue);border-color:var(--blue);color:#fff}
.link-btn{margin-top:4px;background:none;border:0;padding:8px 2px;color:var(--blue);font-weight:600}
.info{margin-top:30px}
.info h3{margin:24px 0 8px;font-size:20px;font-weight:800}
.info ol{margin:0;padding-left:22px}
.info li{margin:6px 0;max-width:62ch}
.info p{margin:6px 0;color:var(--muted)}
.info p b{color:var(--text);font-weight:600}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--red);margin-right:8px;vertical-align:0}
.vid{display:inline-block;margin-top:14px;color:var(--blue);font-weight:700;text-decoration:none}

/* progress + settings */
.page{padding-top:16px}
.page h2{margin:12px 0 10px;font-size:28px;font-weight:800}
.page h3{margin:26px 0 8px;font-size:20px;font-weight:800}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-top:12px}
.empty{background:var(--surface);border-radius:18px;padding:22px;color:var(--muted)}
select{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600}
.chart{margin-top:12px;background:var(--surface);border-radius:18px;padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 11px var(--font)}
.chart .ln{stroke:var(--blue);stroke-width:2.4;fill:none;stroke-linejoin:round}
.chart .pt{fill:var(--blue);stroke:var(--bg);stroke-width:2}
.chart .gl{stroke:var(--line);stroke-width:1}
.best{margin:12px 0 0;font-weight:600}
details{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:28px}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.plan-day{background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:10px}
.plan-day h3{margin:0 0 6px}
.plan-day ul{list-style:none;margin:0;padding:0}
.plan-day li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.plan-day li:first-child{border-top:0}
.plan-day li span:last-child{color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:10px;background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:44ch}
.setting b{font-weight:600}
.setting input[type=checkbox]{width:26px;height:26px;accent-color:var(--blue);flex:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--surface-2);color:var(--text);font-weight:700}
.btn.danger{color:var(--danger)}

/* rest timer + toast */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:30;display:none;align-items:center;gap:12px;
  background:var(--surface-2);border:1px solid var(--line);color:#fff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#rest.show{display:flex}
body.locked #rest{bottom:calc(16px + var(--safe-b))}
#rest .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px}
#rest span:not(.t){color:var(--muted);font-weight:600}
#rest button{min-height:38px;border-radius:999px;border:0;padding:0 16px;font-weight:700;background:var(--blue);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--safe-t));z-index:31;background:#F2F4F6;color:#0B0C0E;
  padding:10px 18px;border-radius:14px;font-weight:600;width:max-content;max-width:90vw;text-align:center;display:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#toast.show{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="top"></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Workout days">
  <button type="button" data-act="day" data-day="push"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16M12 21V8M7 12.5l5-5 5 5"/></svg>Push</button>
  <button type="button" data-act="day" data-day="pull"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M12 3v13M7 11.5l5 5 5-5"/></svg>Pull</button>
  <button type="button" data-act="day" data-day="legs"><svg class="i" viewBox="0 0 24 24"><path d="M9 3v7.5a3 3 0 0 0 .9 2.1L13 15.7V21h6M15 3v6"/></svg>Legs</button>
</nav>
<div id="ex" role="dialog" aria-modal="true" aria-label="Exercise" hidden></div>
<div id="rest" role="timer"><span class="t" id="restT">0:00</span><span>Rest</span><button type="button" data-act="skiprest">Skip</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="vh" tabindex="-1">

<script>
/* ---------- Plan data ---------- */

const EXERCISES = {
  trapbar: {
    name: 'Trap bar deadlift', sets: 3, reps: [6, 8], rest: 120, inc: 10,
    equip: 'Trap bar, plates', muscles: 'Glutes, hamstrings, quads, back',
    cues: ['Stand inside the bar, feet hip-width, and grip the handles with your chest up.',
           'Push the floor away and stand tall, squeezing your glutes at the top.',
           'Lower with control and keep your back flat the whole way.'],
  },
  dbbench: {
    name: 'Dumbbell bench press', sets: 3, reps: [8, 10], rest: 90, inc: 5,
    equip: 'Dumbbells, bench', muscles: 'Chest, shoulders, triceps',
    cues: ['Pull your shoulder blades back and down, and plant your feet.',
           'Lower until your upper arms are about level with the bench.',
           'Press up and slightly in, ending with the dumbbells over your shoulders.'],
  },
  row1: {
    name: 'One-arm dumbbell row', sets: 3, reps: [10, 12], side: true, rest: 60, inc: 5,
    equip: 'Dumbbell, bench', muscles: 'Back, rear shoulders, biceps',
    cues: ['Put one hand and the same-side knee on the bench with your back flat.',
           'Pull your elbow toward your hip, not up to your shoulder.',
           'Pause at the top, then lower until your arm is straight.'],
  },
  pullapart: {
    name: 'Band pull-apart', sets: 2, reps: [15, 20], bw: true, rest: 45, inc: 0,
    equip: 'Resistance band', muscles: 'Rear shoulders, upper back',
    cues: ['Hold the band at chest height with straight arms.',
           'Pull your hands apart and squeeze your shoulder blades together.',
           'Let the band back in slowly. Keep it light and smooth.'],
  },
  wheel: {
    name: 'Ab wheel rollout', sets: 3, reps: [6, 10], bw: true, rest: 60, inc: 0,
    equip: 'Ab wheel', muscles: 'Abs, lats, shoulders',
    cues: ['Kneel with the wheel under your shoulders, ribs down and glutes tight.',
           'Roll out only as far as you can keep your lower back flat.',
           'Pull back with your abs, not your hips. Short reps are fine at first.'],
  },
  goblet: {
    name: 'Goblet squat', sets: 3, reps: [10, 12], rest: 90, inc: 5,
    equip: 'Dumbbell', muscles: 'Quads, glutes, core',
    cues: ['Hold one dumbbell against your chest with your elbows pointing down.',
           'Sit down between your hips and keep your knees tracking over your toes.',
           'Drive up through your whole foot and stand tall.'],
  },
  ohp: {
    name: 'Dumbbell overhead press', sets: 3, reps: [8, 10], rest: 90, inc: 5,
    equip: 'Dumbbells', muscles: 'Shoulders, triceps, upper chest',
    cues: ['Stand tall with your ribs down and glutes tight.',
           'Press straight up until your biceps are next to your ears.',
           'Lower to your shoulders with control. Don\u2019t lean back.'],
  },
  inclinerow: {
    name: 'Incline bench row', sets: 3, reps: [10, 12], rest: 75, inc: 5,
    equip: 'Dumbbells, adjustable bench', muscles: 'Mid back, rear shoulders, biceps',
    cues: ['Set the bench to about 45\u00B0 and lie chest-down with your head neutral.',
           'Row your elbows up and back, squeezing your shoulder blades.',
           'Lower until your arms hang straight. No bouncing.'],
  },
  rdl: {
    name: 'Dumbbell Romanian deadlift', sets: 3, reps: [10, 12], rest: 90, inc: 5,
    equip: 'Dumbbells', muscles: 'Hamstrings, glutes, lower back',
    cues: ['Keep a soft bend in your knees and push your hips straight back.',
           'Slide the dumbbells down your legs with your back flat.',
           'Stop when your hamstrings stretch, then drive your hips forward to stand.'],
  },
  deadbug: {
    name: 'Dead bug', sets: 3, reps: [8, 10], side: true, bw: true, rest: 45, inc: 0,
    equip: 'Floor', muscles: 'Deep abs, hip flexors',
    cues: ['Lie on your back with your arms up and knees bent over your hips.',
           'Press your lower back into the floor, then lower the opposite arm and leg.',
           'Breathe out as you extend. Return and switch sides.'],
  },
  split: {
    name: 'Bulgarian split squat', sets: 3, reps: [8, 10], side: true, rest: 90, inc: 5,
    equip: 'Dumbbells, bench', muscles: 'Quads, glutes',
    cues: ['Rest your back foot on the bench and step the front foot far enough out.',
           'Lower straight down until your front thigh is about level.',
           'Drive through the front heel. Do all reps on one leg, then switch.'],
  },
  pushup: {
    name: 'Push-up', sets: 3, reps: [8, 15], bw: true, rest: 60, inc: 0,
    equip: 'Floor', muscles: 'Chest, shoulders, triceps, core',
    cues: ['Hands under your shoulders and your body in one straight line.',
           'Lower your chest to just above the floor with elbows about 45\u00B0 out.',
           'Too hard? Put your hands on the bench to make it easier.'],
  },
  thrust: {
    name: 'Dumbbell hip thrust', sets: 3, reps: [10, 12], rest: 75, inc: 10,
    equip: 'Dumbbell, bench', muscles: 'Glutes, hamstrings',
    cues: ['Rest your upper back on the bench with a dumbbell across your hips.',
           'Drive through your heels until your shins are vertical.',
           'Squeeze your glutes at the top with your chin tucked, then lower.'],
  },
  latraise: {
    name: 'Dumbbell lateral raise', sets: 3, reps: [12, 15], rest: 60, inc: 5,
    equip: 'Light dumbbells', muscles: 'Side shoulders',
    cues: ['Stand tall with a slight bend in your elbows and the dumbbells at your sides.',
           'Raise your arms out to the sides until they\u2019re level with your shoulders.',
           'Lead with your elbows, pause, then lower slowly. Go light; no swinging.'],
  },
  ohtri: {
    name: 'Overhead triceps extension', sets: 3, reps: [10, 12], rest: 60, inc: 5,
    equip: 'Dumbbell', muscles: 'Triceps',
    cues: ['Hold one dumbbell overhead with both hands cupping the top end.',
           'Keep your elbows pointing up and lower the weight behind your head.',
           'Straighten your arms to lift it back up without flaring your elbows.'],
  },
  curl: {
    name: 'Dumbbell hammer curl', sets: 3, reps: [10, 12], rest: 60, inc: 5,
    equip: 'Dumbbells', muscles: 'Biceps, forearms',
    cues: ['Stand tall with the dumbbells at your sides and palms facing in.',
           'Keep your elbows pinned to your sides and curl the weights to your shoulders.',
           'Lower all the way down with control. No swinging your body.'],
  },
  ballcurl: {
    name: 'Stability ball hamstring curl', sets: 3, reps: [8, 12], bw: true, rest: 60, inc: 0,
    equip: 'Stability ball', muscles: 'Hamstrings, glutes',
    cues: ['Lie on your back with your heels on the ball and lift your hips.',
           'Roll the ball toward your glutes while keeping your hips high.',
           'Extend slowly. If it\u2019s too hard, do it with both heels and a shorter range.'],
  }
};

/* ---------- Storage ---------- */
const STORE_KEY = 'workout-planner.v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign({}, DEFAULTS, JSON.parse(raw));
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let state = loadState();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); memoryOnly = false; }
  catch (e) { if (!memoryOnly) { memoryOnly = true; toast('Can\u2019t save in this browser. Your log will be lost when you close the page.'); } }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayISO = () => isoOf(new Date());
function fmtDate(iso, long) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, long ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
}
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmtNum = n => String(+Number(n).toFixed(1));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function mondayISO() {
  const d = new Date(); const back = (d.getDay() + 6) % 7; d.setDate(d.getDate() - back); return isoOf(d);
}
const weekCount = () => state.sessions.filter(s => s.date >= mondayISO()).length;
function nextDay() {
  const last = state.sessions[state.sessions.length - 1];
  if (!last) return 'push';
  return { push: 'pull', pull: 'legs', legs: 'push' }[last.day] || 'push';
}
const targetSets = ex => state.ease ? Math.max(2, ex.sets - 1) : ex.sets;
function repText(ex) {
  return ex.reps[0] + '\u2013' + ex.reps[1];
}
function lastSets(id) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (s.sets && s.sets[id] && s.sets[id].length) return { sets: s.sets[id], date: s.date };
  }
  return null;
}
function suggest(ex, i) {
  const last = lastSets(ex.id);
  const lo = ex.reps[0], hi = ex.reps[1];
  if (!last) return { w: '', r: lo };
  const L = last.sets;
  const base = L[Math.min(i, L.length - 1)];
  const allTop = L.every(s => s.r >= hi);
  if (ex.bw) return { w: '', r: allTop ? hi : Math.min(hi, base.r + 1) };
  if (allTop && ex.inc) return { w: base.w + ex.inc, r: lo };
  return { w: base.w, r: Math.min(hi, Math.max(lo, base.r + (base.r < hi ? 1 : 0))) };
}

function weightHint(ex, rows, i) {
  const s = suggest(ex, i);
  if (s.w !== '') return s.w;
  for (let j = i - 1; j >= 0; j--) if (rows[j].w !== '') return num(rows[j].w);
  return '';
}

}

const exOf = id => Object.assign({ id }, EXERCISES[id]);

/* ---------- Text helpers ---------- */

}

/* ---------- Progress ---------- */
function metricFor(ex, sets) {

}
function renderChart(id) {

  const W = 320, H = 150, L = 38, R = 14, T = 14, B = 26;
  const vs = pts.map(p => p.v); let lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Progress chart for ' + esc(ex.name) + '">';
  [lo, (lo + hi) / 2, hi].forEach(v => { s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmtNum(v) + '</text>'; });
  if (pts.length > 1) s += '<polyline class="ln" points="' + pts.map((p, i) => x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ') + '"/>';
  pts.forEach((p, i) => { s += '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="4.5"/>'; });
  s += '<text x="' + L + '" y="' + (H - 6) + '">' + fmtDate(pts[0].date) + '</text>';
  if (pts.length > 1) s += '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(pts[pts.length - 1].date) + '</text>';
  return s + '</svg>';
}

  let best = null;
  state.sessions.forEach(s => (s.sets && s.sets[ui.progressEx] || []).forEach(t => {
    const score = ex.bw ? t.r : t.w * 1000 + t.r;
    if (!best || score > best.score) best = { score, t, date: s.date };
  }));
  if (best) h += '<p class="best">Best set: ' + (ex.bw ? best.t.r + ' reps' : fmtNum(best.t.w) + ' ' + state.unit + ' × ' + best.t.r) + ' on ' + fmtDate(best.date) + '</p>';
  h += '<h3>History</h3>';
  state.sessions.slice().reverse().slice(0, 15).forEach(s => {
    const names = Object.keys(s.sets || {});
    const count = names.reduce((a, id) => a + s.sets[id].length, 0);
    h += '<details><summary>' + fmtDate(s.date, true) + ', ' + dayName(s.day) + ' (' + count + ' sets)</summary><ul>'
      + names.map(id => { const e = EXERCISES[id]; return '<li>' + esc(e.name) + ': ' + s.sets[id].map(t => e.bw ? t.r : fmtNum(t.w) + '×' + t.r).join(', ') + '</li>'; }).join('')
      + '</ul></details>';
  });
  return h + '</div>';
}

/* ---------- Plan and settings ---------- */
function renderSettings() {
  let h = '<div class="page"><h2>Your week</h2><p class="muted" style="margin:0;max-width:52ch">Push, pull, legs. Do the three days in order on any three days of the week, ideally with a rest day between. Rest times run after every set.</p>';
  Object.keys(DAYS).forEach(k => {
    const d = DAYS[k];
    h += '<section class="plan-day"><h3>' + d.name + ': ' + esc(d.focus) + '</h3><ul>'
      + d.ids.map(id => { const e = exOf(id); return '<li><span>' + esc(e.name) + '</span><span>' + targetSets(e) + ' × ' + repText(e) + (e.side ? ' each' : '') + '</span></li>'; }).join('')
      + '</ul></section>';
  });
  h += '<h3>How progression works</h3><p class="muted" style="max-width:56ch;margin:0">When you hit the top of the rep range on every set, the app suggests the next weight up and drops you back to the bottom of the range. Until then, it suggests one more rep than last time.</p>';
  h += '<h3>Settings</h3><div class="card">'
    + '<div class="setting"><div><b>Weight unit</b><p>Switching doesn’t convert past entries.</p></div><div class="seg" role="group" aria-label="Weight unit"><button type="button" data-act="unit" data-u="lb" aria-pressed="' + (state.unit === 'lb') + '">lb</button><button type="button" data-act="unit" data-u="kg" aria-pressed="' + (state.unit === 'kg') + '">kg</button></div></div>'
    + '<div class="setting"><div><b>Ease-in weeks</b><p>One fewer set on each exercise. Keep 2–3 reps in reserve while you rebuild.</p></div><input type="checkbox" data-act="ease" aria-label="Ease-in weeks"' + (state.ease ? ' checked' : '') + '></div>'
    + '<div class="setting" style="display:block"><b>Backup</b><p>Your log lives in this browser. Export a copy now and then, and import it on a new phone or browser.</p><div class="btns"><button type="button" class="btn" data-act="export">Export backup</button><button type="button" class="btn" data-act="import">Import backup</button><button type="button" class="btn danger" data-act="reset">Erase all data</button></div></div>'
    + '</div></div>';
  return h;
}

/* ---------- Render ---------- */
function render() {
  const y = window.scrollY, ov = $('#ex');
  $('#top').innerHTML = topHTML();
  $('#app').innerHTML = ui.view === 'progress' ? renderProgress() : ui.view === 'settings' ? renderSettings() : renderDay();
  const nd = nextDay();
  document.querySelectorAll('.tabs [data-day]').forEach(b => {
    const on = ui.view === 'day' && b.dataset.day === ui.day;
    b.classList.toggle('on', on);
    b.classList.toggle('next', b.dataset.day === nd);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    b.setAttribute('aria-label', DAYS[b.dataset.day].name + ' day' + (b.dataset.day === nd ? ', up next' : ''));
  });
  if (ui.ex) {
    const same = ov.dataset.ex === ui.ex, top = ov.scrollTop;
    ov.innerHTML = renderExercise(ui.ex);
    ov.dataset.ex = ui.ex;
    ov.hidden = false;
    document.body.classList.add('locked');
    if (same) ov.scrollTop = top;
    else {
      ov.scrollTop = 0;
      const cur = ov.querySelector('.strip .cur');
      if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  } else {
    ov.hidden = true; ov.innerHTML = ''; delete ov.dataset.ex;
    document.body.classList.remove('locked');
  }
  window.scrollTo(0, y);
}

/* ---------- Rest timer + toast ---------- */
let restEnd = 0, restTick = null, toastTimer = null;
function startRest(sec) {
  restEnd = Date.now() + sec * 1000;
  $('#rest').classList.add('show');
  clearInterval(restTick); restTick = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0) { stopRest(); if (navigator.vibrate) navigator.vibrate(250); toast('Rest is over. Next set.'); return; }
  $('#restT').textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
}
function stopRest() { clearInterval(restTick); $('#rest').classList.remove('show'); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- Actions ---------- */
function toggleDone(id, i) {
  const d = getDraft(ui.day), ex = exOf(id), row = d.sets[id][i];
  if (!row.done) {
    const s = suggest(ex, i), wh = weightHint(ex, d.sets[id], i);
    if (!ex.bw && row.w === '' && wh === '') {
      toast('Enter the weight for this set first.');
      ui.edit = true; render();
      const el = document.querySelector('input[data-f="w"][data-id="' + id + '"][data-i="' + i + '"]'); if (el) el.focus();
      return;
    }
    if (!ex.bw && row.w === '') row.w = fmtNum(wh);
    if (row.r === '') row.r = String(s.r);
    row.done = true;
    startRest(ex.rest);
    if (doneCount(d, id) >= d.sets[id].length) toast(nextExercise(ui.day, d, id) ? ex.name + ' done.' : 'Last set done. Finish to save your workout.');
  } else row.done = false;
  save(); render();
}
function logSet(id) {
  const rows = getDraft(ui.day).sets[id], i = rows.findIndex(r => !r.done);
  if (i >= 0) toggleDone(id, i);
}
function openExercise(id) { ui.ex = id; ui.edit = false; render(); }
function startWorkout() {
  const d = getDraft(ui.day);
  openExercise(firstIncomplete(ui.day, d) || DAYS[ui.day].ids[0]);
}

function finish() {
  const day = ui.day, d = getDraft(day), out = {}; let n = 0;
  DAYS[day].ids.forEach(id => {
    const ex = exOf(id);
    const rows = d.sets[id].filter(r => r.done).map(r => ({ w: ex.bw ? 0 : num(r.w), r: Math.round(num(r.r)) }));
    if (rows.length) { out[id] = rows; n += rows.length; }
  });
  if (!n) return;
  state.sessions.push({ id: Date.now(), date: todayISO(), day, sets: out });
  delete state.drafts[day];
  ui.day = nextDay(); ui.ex = null; ui.view = 'day'; ui.warm = undefined;
  save(); stopRest();
  toast('Workout saved. ' + weekCount() + ' of 3 this week.');
  render(); window.scrollTo(0, 0);
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'workout-planner-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'day') { ui.day = el.dataset.day; ui.view = 'day'; ui.ex = null; ui.warm = undefined; render(); window.scrollTo(0, 0); }
  else if (act === 'view') { ui.view = el.dataset.v; render(); window.scrollTo(0, 0); }
  else if (act === 'open') openExercise(el.dataset.id);
  else if (act === 'start') startWorkout();
  else if (act === 'close') { ui.ex = null; ui.edit = false; render(); }
  else if (act === 'edit') { ui.edit = !ui.edit; render(); }
  else if (act === 'log') logSet(el.dataset.id);
  else if (act === 'warm') { ui.warm = !warmOpenNow(); render(); }
  else if (act === 'done') toggleDone(el.dataset.id, +el.dataset.i);
  else if (act === 'addset') { getDraft(ui.day).sets[el.dataset.id].push({ w: '', r: '', done: false }); save(); render(); }
  else if (act === 'finish') finish();
  else if (act === 'skiprest') stopRest();
  else if (act === 'unit') { state.unit = el.dataset.u; save(); render(); }
  else if (act === 'export') exportData();
  else if (act === 'import') $('#importFile').click();
  else if (act === 'reset') { if (confirm('Erase every logged workout on this device? This can’t be undone.')) { state = JSON.parse(JSON.stringify(DEFAULTS)); ui.day = 'push'; ui.ex = null; save(); render(); toast('All data erased.'); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.ex) { ui.ex = null; ui.edit = false; render(); } });
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset && el.dataset.act;
  if (act === 'warmitem') { getDraft(ui.day).warm[el.dataset.id] = el.checked; save(); render(); }
  else if (act === 'ease') { state.ease = el.checked; save(); render(); }
  else if (act === 'pex') { ui.progressEx = el.value; render(); }
  else if (el.id === 'importFile' && el.files[0]) {
    const f = el.files[0], rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.sessions)) throw new Error('bad file');
        if (confirm('Replace your current log with this backup?')) { state = Object.assign({}, DEFAULTS, data); ui.day = nextDay(); ui.ex = null; save(); render(); toast('Backup imported.'); }
      } catch (err) { toast('That file isn’t a Workout Planner backup.'); }
      el.value = '';
    };
    rd.readAsText(f);
  }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  const row = getDraft(ui.day).sets[el.dataset.id][+el.dataset.i];
  row[el.dataset.f] = el.value.replace(',', '.');
  save();
});

render();
</script>
</body>
</html>
